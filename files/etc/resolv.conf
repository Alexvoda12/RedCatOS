# RedCatOS: DNS-серверы для пользовательского резолвера (user/curl.c, Этап 13).
# Формат: "nameserver IP[:PORT]", порт по умолчанию 53. Порядок — приоритет.
#
# 10.0.2.3 — "виртуальный DNS" SLIRP (QEMU): он пересылает запросы на
# DNS-серверы самого хоста, поэтому имена из интернета работают как есть.
# 10.0.2.2 — адрес хоста: сюда net-test пробрасывает свой DNS-стаб
# (tools/net_stub.py, см. guestfwd в Makefile).
nameserver 10.0.2.3
nameserver 10.0.2.2
