# RedCatOS: настройки проводной сети. Читает ЯДРО при загрузке (net_init,
# Этап 13), поэтому действуют после перезагрузки, а не после правки файла.
#
# Формат: "ключ значение". Строки с # — комментарии; неизвестный ключ
# ядро отметит в klog строкой "net: bad line ..." и оставит прежним.
#
# Значения по умолчанию — те, что даёт SLIRP (встроенный TCP/IP стек QEMU):
# гость получает 10.0.2.15, шлюз и "внешний мир" — 10.0.2.2. На настоящей
# сети пропишите свои адреса: DHCP пока не умеем (TODO).
address 10.0.2.15
netmask 255.255.255.0
gateway 10.0.2.2
